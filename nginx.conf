server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Serve "/" as HTML (no redirect)
  location = / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /index.html =404;
  }

  # Ensure /index.html revalidates too
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
